<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Search The Dev Anvil's articles, tutorials, and guides on HTML, CSS, JavaScript, Git, and modern web development."/>
    <link rel="canonical" href="https://the-dev-anvil.vercel.app/search.html">

    <link rel="stylesheet" href="css/shared.css">

    <script src="https://kit.fontawesome.com/8e0278b98b.js" crossorigin="anonymous"></script>
    <script>
      (function () {
        var saved = localStorage.getItem("theme");
        if (saved === "dark" || (!saved && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a href="index.html" class="brand">
                <img src="Images/logo_small(without bg, reduced size).png" alt="The Dev Anvil Logo">
                <span class="brand-text">The Dev Anvil</span>
            </a>
            <form class="nav-search" action="search.html" method="get" role="search">
                <input type="text" name="q" placeholder="Type to search..." aria-label="Search articles">
            </form>
            <nav class="main-nav">
                <a href="index.html">Home</a>
                <a href="about-me.html">About</a>
                <a href="https://kt-portfolio-website.vercel.app" target="_blank">My Portfolio</a>
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode"><i class="fas fa-moon"></i><i class="fas fa-sun"></i></button>
            </nav>
        </div>
    </header>

    <main class="site-main">
        <div class="search-page">
            <h1 class="search-title">Search Results</h1>
            <p class="results-meta" id="results-meta"></p>
            <div class="post-grid" id="results"></div>
        </div>

    <footer class="site-footer">
        <div class="footer-inner">
            <div class="footer-brand">
                <img src="Images/logo_small(without bg, reduced size).png" alt="The Dev Anvil Logo">

                <a href="https://x.com/oluwakitan17466" target="_blank" title="Twitter"><i class="fab fa-twitter"></i></a>
                <a href="https://www.linkedin.com/in/kitan-ayoola-1471193a1/" target="_blank" title="LinkedIn"><i class="fab fa-linkedin"></i></a>
                <a href="mailto:ayoli2020@gmail.com" target="_blank" title="Email"><i class="fas fa-envelope"></i></a>
            </div>
        </div>
    </footer>

    <script id="dsq-count-scr" src="//the-dev-anvil.disqus.com/count.js" async></script>
